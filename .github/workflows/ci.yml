name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Checks only: the release build is a local step (see README) — the repo
# keeps sources, not binaries.
jobs:
  checks:
    name: analyze + tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ExDesktop
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget tests
        run: flutter test

      - name: Mock suites
        run: dart run test/mock_all.dart