[package]
name = "sysctl"
version = "0.1.0"
edition = "2021"

[lib]
name = "sysctl"
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_Ndis",
  "Win32_Graphics_Gdi",
  "Win32_System_Time",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true